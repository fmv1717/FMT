*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Courier New',monospace;background:#0a0a0f;color:#e0e0e0;min-height:100vh}
:root{--gold:#c9a84c;--gold2:#f0c040;--red:#e05555;--green:#4caf7d;--blue:#5599ff;--bg:#0a0a0f;--bg2:#131320;--bg3:#1a1a2e;--border:#2a2a3e;--text:#e0e0e0;--muted:#777;}
header{background:var(--bg3);border-bottom:2px solid var(--gold);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-size:1.1rem;color:var(--gold);letter-spacing:2px;font-weight:700}
header span{font-size:.7rem;color:var(--muted)}
.tech-bar{background:var(--bg2);padding:10px 16px;display:flex;gap:8px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tech-btn{padding:6px 16px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);border-radius:4px;cursor:pointer;font-family:inherit;font-size:.8rem;letter-spacing:1px;transition:all .2s}
.tech-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.1)}
.kpi-bar{display:flex;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.kpi{text-align:center;min-width:70px}.kpi .num{font-size:1.4rem;font-weight:700;color:var(--gold2)}.kpi .lbl{font-size:.65rem;color:var(--muted);letter-spacing:1px}
.filter-bar{padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-family:inherit;font-size:.8rem}
.filter-bar select:focus,.filter-bar input:focus{outline:none;border-color:var(--gold)}
#prospect-list{padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.prospect-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px;cursor:pointer;transition:border-color .2s}
.prospect-card:hover{border-color:var(--gold)}
.prospect-card.s-Won{border-left:3px solid var(--green)}.prospect-card.s-Lost{border-left:3px solid var(--red)}
.prospect-card.s-Introduced,.prospect-card.s-Spoke{border-left:3px solid var(--blue)}
.prospect-card.s-Follow,.prospect-card.s-Proposal{border-left:3px solid var(--gold)}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc-name{font-size:.9rem;font-weight:700;color:var(--text)}
.pc-badge{font-size:.65rem;padding:2px 8px;border-radius:10px;white-space:nowrap;background:rgba(201,168,76,.15);color:var(--gold);border:1px solid rgba(201,168,76,.3)}
.pc-meta{font-size:.7rem;color:var(--muted);margin-top:4px}.pc-status{font-size:.7rem;color:var(--muted);margin-top:4px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg3);border:1px solid var(--border);border-radius:12px 12px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:20px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h2{font-size:1rem;color:var(--gold)}.close-btn{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
.fg{margin-bottom:14px}.fg label{display:block;font-size:.7rem;color:var(--muted);letter-spacing:1px;margin-bottom:4px}
.fg select,.fg textarea,.fg input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:4px;font-family:inherit;font-size:.85rem}
.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--gold)}.fg textarea{height:80px;resize:vertical}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{padding:10px 20px;border:none;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.8rem;letter-spacing:1px;font-weight:700;transition:all .2s}
.btn-gold{background:var(--gold);color:#000}.btn-gold:hover{background:var(--gold2)}
.btn-outline{background:none;border:1px solid var(--border);color:var(--muted)}.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.map-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:none;border:1px solid var(--blue);color:var(--blue);border-radius:4px;cursor:pointer;font-family:inherit;font-size:.8rem;text-decoration:none}
#scorecard-view{display:none;padding:16px}
.score-section{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.score-section h3{font-size:.8rem;color:var(--gold);letter-spacing:2px;margin-bottom:12px}
.score-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.score-row:last-child{border-bottom:none}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg3);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;padding:12px 4px;text-align:center;cursor:pointer;font-family:inherit;font-size:.65rem;color:var(--muted);letter-spacing:1px;background:none;border:none;transition:color .2s}
.nav-btn.active{color:var(--gold)}.nav-btn .icon{font-size:1.2rem;display:block;margin-bottom:2px}
.content-area{padding-bottom:70px}
#email-status{padding:6px 12px;border-radius:4px;font-size:.75rem;display:none;margin-top:8px}
.email-ok{background:rgba(76,175,125,.2);color:var(--green);border:1px solid var(--green)}
.email-err{background:rgba(224,85,85,.2);color:var(--red);border:1px solid var(--red)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 20px;border-radius:20px;font-size:.8rem;font-weight:700;opacity:0;transition:opacity .3s;z-index:300;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>

  <div class="kpi"><div class="num" id="k-proposal">0</div><div class="lbl">PROPOSALS</div></div>
</div>
<div class="content-area">
<div id="prospects-view">
  <div class="filter-bar">
    <select id="cluster-filter" onchange="renderList()"><option value="">ALL CLUSTERS</option></select>
    <select id="status-filter" onchange="renderList()">
      <option value="">ALL STATUS</option><option>Not Visited</option><option>Introduced</option>
      <option>Spoke to Manager</option><option>Follow Up Needed</option><option>Proposal Sent</option>
      <option>Won</option><option>Lost</option>
    </select>
    <select id="segment-filter" onchange="renderList()">
      <option value="">ALL SEGMENTS</option><option>Hotel</option><option>Fitness</option>
      <option>Corporate</option><option>Medical</option><option>Club/Resort</option>
      <option>University</option><option>Retail/Commercial</option><option>Entertainment</option>
    </select>
    <input id="search-input" placeholder="Search..." oninput="renderList()" style="flex:1;min-width:100px">
  </div>
  <div id="prospect-list"></div>
</div>
<div id="scorecard-view">
  <div class="score-section"><h3>STATUS BREAKDOWN</h3><div id="scorecard-content"></div></div>
  <div class="score-section"><h3>BY TECH</h3><div id="pipeline-content"></div></div>
  <div class="score-section">
    <h3>EMAIL REPORT</h3>
    <button class="btn btn-gold" id="send-btn" onclick="sendDailyReport()" style="width:100%">SEND DAILY REPORT</button>
    <div id="email-status"></div>
  </div>
  <div class="score-section">
    <h3>EXPORT</h3>
    <button class="btn btn-outline" onclick="exportCSV()" style="width:100%">EXPORT CSV FOR SERVICEMINDER</button>
  </div>
</div>
</div>
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-prospects" onclick="switchView('prospects')"><span class="icon">📋</span>PROSPECTS</button>
  <button class="nav-btn" id="nav-scorecard" onclick="switchView('scorecard')"><span class="icon">📊</span>SCORECARD</button>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header"><h2 id="modal-name">—</h2><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div id="modal-meta" style="font-size:.75rem;color:var(--muted);margin-bottom:16px"></div>
    <div class="fg"><label>STATUS</label>
      <select id="m-status"><option>Not Visited</option><option>Introduced</option><option>Spoke to Manager</option><option>Follow Up Needed</option><option>Proposal Sent</option><option>Won</option><option>Lost</option></select></div>
    <div class="fg"><label>SERVICE NEED</label>
      <select id="m-service"><option value="">—</option><option>PM Contract</option><option>One-Time Repair</option><option>Equipment Assessment</option><option>No Need Identified</option></select></div>
    <div class="fg"><label>FOLLOW UP</label>
      <select id="m-followup"><option value="">—</option><option>Yes - Send Proposal</option><option>Yes - Call Back</option><option>Yes - Email Info</option><option>No Follow Up</option></select></div>
    <div class="fg"><label>NOTES</label><textarea id="m-notes" placeholder="Contact name, equipment count, decision maker..."></textarea></div>
    <div class="btn-row">
      <button class="btn btn-gold" onclick="saveProspect()">SAVE</button>
      <a id="map-link" class="map-btn" target="_blank">MAP</a>
      <button class="btn btn-outline" onclick="closeModal()">CANCEL</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
var DATA = JSON.parse(document.getElementById("fmt-data").textContent).prospects;
var currentTech = "all";
var currentId = null;
emailjs.init("TIdTUD8SlyP_4NXMC");

function loadSaved(){
  DATA.forEach(function(p){
    var s = localStorage.getItem("fmt_"+p.id);
    if(s){try{var o=JSON.parse(s);p.status=o.status||p.status;p.notes=o.notes||"";p.service_need=o.service_need||"";p.follow_up=o.follow_up||"";}catch(e){}}
  });
}
function saveLocal(p){localStorage.setItem("fmt_"+p.id,JSON.stringify({status:p.status,notes:p.notes,service_need:p.service_need,follow_up:p.follow_up}));}
function getScope(){return currentTech==="all"?DATA:DATA.filter(function(p){return p.tech===currentTech;});}
function getFiltered(){
  var cl=document.getElementById("cluster-filter").value;
  var st=document.getElementById("status-filter").value;
  var sg=document.getElementById("segment-filter").value;
  var q=document.getElementById("search-input").value.toLowerCase();
  return getScope().filter(function(p){
    if(cl&&p.cluster!==cl)return false;
    if(st&&p.status!==st)return false;
    if(sg&&p.segment!==sg)return false;
    if(q&&!p.name.toLowerCase().includes(q)&&!p.address.toLowerCase().includes(q))return false;
    return true;
  });
}
function populateClusterFilter(){
  var sel=document.getElementById("cluster-filter");var cur=sel.value;
  sel.innerHTML="<option value=''>ALL CLUSTERS</option>";
  var cls=[];getScope().forEach(function(p){if(!cls.includes(p.cluster))cls.push(p.cluster);});
  cls.sort().forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o);});
  sel.value=cur;
}
function updateKPIs(){
  var sc=getScope();
  document.getElementById("k-total").textContent=sc.length;
  document.getElementById("k-visited").textContent=sc.filter(function(p){return p.status!=="Not Visited";}).length;
  document.getElementById("k-pm").textContent=sc.filter(function(p){return p.service_need==="PM Contract";}).length;
  document.getElementById("k-won").textContent=sc.filter(function(p){return p.status==="Won";}).length;
  document.getElementById("k-proposal").textContent=sc.filter(function(p){return p.status==="Proposal Sent";}).length;
  document.getElementById("header-count").textContent=sc.length+" prospects";
}
function renderList(){
  var items=getFiltered();var html="";
  items.forEach(function(p){
    var cl=p.status.split(" ")[0];
    html+="<div class='prospect-card s-"+cl+"' onclick='openModal(""+p.id+"")'>";
    html+="<div class='pc-top'><div class='pc-name'>"+p.name+"</div><span class='pc-badge'>"+p.segment+"</span></div>";
    html+="<div class='pc-meta'>"+p.address+"</div>";
    html+="<div class='pc-status'>"+p.status+(p.service_need?" &nbsp;|&nbsp; "+p.service_need:"")+"</div>";
    html+="</div>";
  });
  if(!html)html="<div style='text-align:center;color:var(--muted);padding:40px;font-size:.85rem'>No results</div>";
  document.getElementById("prospect-list").innerHTML=html;
  updateKPIs();
}
function openModal(id){
  currentId=id;var p=DATA.find(function(x){return x.id===id;});
  document.getElementById("modal-name").textContent=p.name;
  document.getElementById("modal-meta").textContent=p.address+" · "+p.contact_title+" · "+p.cluster;
  document.getElementById("m-status").value=p.status;
  document.getElementById("m-service").value=p.service_need||"";
  document.getElementById("m-followup").value=p.follow_up||"";
  document.getElementById("m-notes").value=p.notes||"";
  document.getElementById("map-link").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.address);
  document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open");currentId=null;}
function saveProspect(){
  var p=DATA.find(function(x){return x.id===currentId;});
  p.status=document.getElementById("m-status").value;
  p.service_need=document.getElementById("m-service").value;
  p.follow_up=document.getElementById("m-followup").value;
  p.notes=document.getElementById("m-notes").value;
  saveLocal(p);
  if(p.service_need==="PM Contract"||p.service_need==="One-Time Repair"||p.follow_up==="Yes - Send Proposal"){
    emailjs.send("service_tuitok8","template_0eoj1yb",{notes:"LEAD ALERT\n"+p.name+"\n"+p.address+"\n"+p.tech+"\n"+p.status+"\n"+p.service_need+"\n"+p.notes});
  }
  closeModal();renderList();showToast("Saved!");
}
function sendDailyReport(){
  var sc=getScope();
  var body="FMT DAILY REPORT\nDate: "+new Date().toLocaleDateString()+"\nTech: "+currentTech+"\n\n";
  body+="Visited: "+sc.filter(function(p){return p.status!=="Not Visited";}).length+"/"+sc.length+"\n";
  body+="PM Leads: "+sc.filter(function(p){return p.service_need==="PM Contract";}).length+"\n";
  body+="Proposals: "+sc.filter(function(p){return p.status==="Proposal Sent";}).length+"\n";
  body+="Won: "+sc.filter(function(p){return p.status==="Won";}).length+"\n\nACTIVE LEADS:\n";
  sc.filter(function(p){return p.status!=="Not Visited"&&p.status!=="Lost";}).forEach(function(p){body+=p.name+" | "+p.status+" | "+(p.service_need||"—")+"\n";});
  var btn=document.getElementById("send-btn");btn.textContent="SENDING...";btn.disabled=true;
  emailjs.send("service_tuitok8","template_0eoj1yb",{notes:body}).then(function(){
    var s=document.getElementById("email-status");s.className="email-ok";s.textContent="Sent!";s.style.display="block";
    btn.textContent="SEND DAILY REPORT";btn.disabled=false;
  },function(err){
    var s=document.getElementById("email-status");s.className="email-err";s.textContent="Failed: "+JSON.stringify(err);s.style.display="block";
    btn.textContent="SEND DAILY REPORT";btn.disabled=false;
  });
}
function renderScorecard(){
  var sc=getScope();var byS={};
  sc.forEach(function(p){byS[p.status]=(byS[p.status]||0)+1;});
  var html="";
  ["Not Visited","Introduced","Spoke to Manager","Follow Up Needed","Proposal Sent","Won","Lost"].forEach(function(s){html+="<div class='score-row'><span>"+s+"</span><span>"+(byS[s]||0)+"</span></div>";});
  document.getElementById("scorecard-content").innerHTML=html;
  var byT={};
  DATA.forEach(function(p){if(!byT[p.tech])byT[p.tech]={t:0,v:0,pm:0,w:0};byT[p.tech].t++;if(p.status!=="Not Visited")byT[p.tech].v++;if(p.service_need==="PM Contract")byT[p.tech].pm++;if(p.status==="Won")byT[p.tech].w++;});
  var ph="";
  ["Tech 1","Tech 2","Tech 3"].forEach(function(t){var d=byT[t]||{t:0,v:0,pm:0,w:0};ph+="<div class='score-row' style='flex-direction:column;gap:2px'><strong style='color:var(--gold)'>"+t+"</strong><span style='color:var(--muted);font-size:.75rem'>"+d.v+"/"+d.t+" visited · "+d.pm+" PM · "+d.w+" won</span></div>";});
  document.getElementById("pipeline-content").innerHTML=ph;
}
function switchView(v){
  document.getElementById("prospects-view").style.display=v==="prospects"?"block":"none";
  document.getElementById("scorecard-view").style.display=v==="scorecard"?"block":"none";
  document.getElementById("nav-prospects").classList.toggle("active",v==="prospects");
  document.getElementById("nav-scorecard").classList.toggle("active",v==="scorecard");
  if(v==="scorecard")renderScorecard();
}
function exportCSV(){
  var sc=getScope();
  var rows=["Name,Address,Segment,Contact,Tech,Cluster,Status,Service Need,Follow Up,Notes"];
  sc.forEach(function(p){rows.push([p.name,p.address,p.segment,p.contact_title,p.tech,p.cluster,p.status,p.service_need||"",p.follow_up||"",p.notes||""].map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(","));});
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"}));
  a.download="FMT_Prospects_"+new Date().toISOString().slice(0,10)+".csv";a.click();
}
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2000);}
document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});
document.querySelectorAll(".tech-btn").forEach(function(b){b.addEventListener("click",function(){currentTech=this.dataset.tech;document.querySelectorAll(".tech-btn").forEach(function(x){x.classList.remove("active");});this.classList.add("active");populateClusterFilter();renderList();});});
loadSaved();populateClusterFilter();renderList();
</script>
</body>
</html>
